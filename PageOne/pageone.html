<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page One</title>
    <!-- <link rel="stylesheet" href="pageone.css"> -->
</head>

<body>
    
    <form class="my_form">
        <h1> Application Form</h1>
        <label>First Name:</label>
        <input type="text" name="first_name" required>
        <label>Last Name:</label>
        <input type="text" name="last_name" required><br><br>
        <label>Date of birth</label>
        <input type="date" name="dob" required>
        <label>Age</label>
        <input type="number" name="age" required><br><br>
        <label>Gender</label>
        <select name="gender" required>
            <option value="">Male</option>
            <option value="">Female</option>
        </select>
        <label>Email Address</label>
        <input type="email" name="email" required><br><br>
        <lable>Positions Avalible:</lable>
        <input type="radio" name="position" value="position1">
        <lable>Junior Developer</lable>
        <input type="radio" name="position" value="position2">
        <lable>Mid-level Developer</lable>
        <input type="radio" name="position" value="position3">
        <lable>Senior Developer</lable><br><br>
        <lable>Programming Languages:</lable>
        <input type="checkbox" name="language" value="python">
         <lable>python</lable>
        <input type="checkbox" name="language" value="java">
         <lable>java</lable>
        <input type="checkbox" name="language" value="javascript">
         <lable>javascript</lable><br><br>
        <lable>Password:</lable>
        <input type="password" name="password" required>
        <lable>Confirm Password</lable> 
        <input type="password" name="confirm_password" required><br><br>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button> 
    </form>

</body>

</html>
